# Base Configuration (loaded across all profiles)
spring.application.name=javasimple

# Default active profile if none is specified
spring.profiles.active=dev

# 1. String
app.environment=default
app.app-name=Java Simple API
app.greeting=${APP_GREETING:Hello from Default Environment!}

# 2. Integer
app.server-port=${PORT:8080}
app.max-retries=${MAX_RETRIES:3}

# 3. Long
app.rate-limit=${RATE_LIMIT:100000}

# 4. Boolean
app.feature-flag-enabled=${FEATURE_FLAG_ENABLED:false}

# 5. Double
app.tax-rate=${TAX_RATE:0.08}

# 6. List / Array
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# 7. Map / Key-Value
app.metadata.region=${REGION:us-east-1}
app.metadata.tier=${TIER:standard}

# 8. Duration (parsed by Spring e.g. 5s, 10m, 1h)
app.timeout=${APP_TIMEOUT:30s}

# 9. DataSize (parsed by Spring e.g. 10MB, 500KB)
app.max-file-size=${MAX_FILE_SIZE:10MB}

# 10. Sensitive placeholder (fallback for local dev, overridden in stage/prod by OS env)
app.secret-api-key=${SECRET_API_KEY:dev-local-secret-key-12345}

# 11. JWT Authentication Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
